# VibeGIS stack: PostGIS + MapServer + QGIS Server + Dagster + Cesium
# Start:  docker compose up -d
# Tools:  docker compose --profile tools up -d      (adds pgAdmin)
# Terrain: docker compose --profile terrain run --rm ctb   (one-shot build)

name: vibegis

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

services:

  # ---------------------------------------------------------------- database
  postgis:
    image: ${POSTGIS_IMAGE}
    container_name: vibegis-postgis
    restart: unless-stopped
    environment:
      <<: *postgres-env
      # Tuning; raise shared_buffers if you give Docker more RAM
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_parallel_workers_per_gather=4
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./postgis/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [vibegis]

  # --------------------------------------------------------------- mapserver
  # Fast WMS/WMTS/OGC-API rendering. Serves imagery + Terrain-RGB to Cesium.
  mapserver:
    image: ${MAPSERVER_IMAGE}
    container_name: vibegis-mapserver
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      MS_MAPFILE: /etc/mapserver/vibegis.map
      MS_DEBUGLEVEL: "1"
      MS_ERRORFILE: stderr
      # consumed inside the mapfile via CONNECTION
      PGHOST: postgis
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Apache's default (8190) is far too small for a GetMap carrying a full
      # SLD_BODY once a layer has a user-defined classification (see
      # upload-api's /layer-config): one rule per distinct value, so a
      # 140-value column alone already runs ~88KB, well past the 65536 this
      # was previously set to for the (much smaller) hand-authored legends.
      # /distinct-values caps a classification at 500 classes; sized with
      # comfortable headroom above that worst case.
      APACHE_LIMIT_REQUEST_LINE: "2097152"
    volumes:
      - ./mapserver/mapfiles:/etc/mapserver:ro
      - ./mapserver/data:/data:ro
      # Not nested under /data: /data is itself a read-only mount, and Docker
      # can't create a mountpoint for a second bind mount inside an
      # already-read-only parent mount at container-creation time.
      - ./mapserver/rasters:/rasters:ro
    networks: [vibegis]

  # ------------------------------------------------------------- qgis server
  # Headless. Publish by dropping .qgs/.qgz files into ./qgis-server/projects
  # and requesting  ?MAP=/io/data/<project>.qgs&SERVICE=WMS&...
  qgis-server:
    image: ${QGISSERVER_IMAGE}
    container_name: vibegis-qgis-server
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      QGIS_SERVER_LOG_LEVEL: "1"
      QGIS_SERVER_LOG_STDERR: "1"
      QGIS_SERVER_PARALLEL_RENDERING: "true"
      QGIS_SERVER_MAX_THREADS: "4"
      QGIS_SERVER_CACHE_SIZE: "500000000"
      QGIS_PROJECT_FILE: ""
      PGHOST: postgis
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./qgis-server/projects:/io/data:ro
    networks: [vibegis]

  # ------------------------------------------------------------------ dagster
  dagster:
    build:
      context: ./dagster
      args:
        GDAL_IMAGE: ${GDAL_IMAGE}
    container_name: vibegis-dagster
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      <<: *postgres-env
      POSTGRES_HOST: postgis
      DAGSTER_HOME: /opt/dagster/home
    volumes:
      - ./dagster:/opt/dagster/app
      - dagster-home:/opt/dagster/home
      - ./mapserver/data:/data/raster
      - ./terrain/dem:/data/dem
    ports:
      - "127.0.0.1:${DAGSTER_PORT}:3000"
    networks: [vibegis]

  # -------------------------------------------------------------- upload-api
  # Turns an uploaded shapefile/GeoPackage/GeoJSON/KML/GML into a PostGIS
  # table (schema "raw") plus a LAYER block appended to
  # mapserver/mapfiles/uploads.map — MapServer re-parses its mapfile on every
  # request, so the new layer shows up in GetCapabilities immediately.
  upload-api:
    build:
      context: ./upload-api
      args:
        GDAL_IMAGE: ${GDAL_IMAGE}
    container_name: vibegis-upload-api
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PGHOST: postgis
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      GATEWAY_PORT: ${GATEWAY_PORT}
    volumes:
      - ./mapserver/mapfiles:/mapfiles
      # Read-write, unlike mapserver's own :ro mount of the same host path —
      # this is what lets POST /upload-raster land a normalized GeoTIFF
      # somewhere mapserver can then read it from.
      - ./mapserver/rasters:/rasters
      # Styling is written here, so tile invalidation has to happen here too:
      # MapProxy exposes no purge endpoint, so a restyle deletes the layer's
      # cache directory directly. See purge_layer_cache() in upload-api/app.py.
      - mapproxy-cache:/mapproxy-cache
      # Read-write, unlike mapproxy's own :ro mount of the same host path —
      # this is what lets generate_mapproxy_config() add a layer/cache/source
      # for every layer this service publishes.
      - ./mapproxy:/mapproxy-config
    expose:
      - "8000"
    networks: [vibegis]

  # ------------------------------------------------------------------ gateway
  # Single origin for the browser -> no CORS problems in Cesium.
  gateway:
    image: ${NGINX_IMAGE}
    container_name: vibegis-gateway
    restart: unless-stopped
    depends_on: [mapserver, qgis-server, frontend, upload-api]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./terrain/tiles:/usr/share/nginx/terrain:ro
      - ./frontend-app/public/3dtiles:/usr/share/nginx/tiles3d:ro
    ports:
      - "${GATEWAY_PORT}:80"
    networks: [vibegis]

  # ------------------------------------------------------ tile cache (WMS)
  # Caches MapServer output on disk. mapproxy.yaml here is machine-written by
  # upload-api (generate_mapproxy_config() in upload-api/app.py) — every layer
  # it publishes gets a layer/cache/source triple automatically. A dirty diff
  # is expected, same as uploads.map/layer_config.json; don't hand-edit while
  # the stack is up.
  mapproxy:
    build:
      context: ./mapproxy
    container_name: vibegis-mapproxy
    restart: unless-stopped
    depends_on: [mapserver]
    volumes:
      - ./mapproxy:/mapproxy/config:ro
      - mapproxy-cache:/mapproxy/cache_data
    expose:
      - "8080"
    networks: [vibegis]

  # ------------------------------------------------- OGC API Features (JSON)
  # Publishes PostGIS tables and functions as GeoJSON. Used by the search box.
  featureserv:
    image: ${FEATURESERV_IMAGE}
    container_name: vibegis-featureserv
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB}"
      PGFS_SERVER_HTTPPORT: "9000"
      PGFS_SERVER_BASEPATH: "/features"
      PGFS_PAGING_LIMITMAX: "1000"
    expose:
      - "9000"
    networks: [vibegis]

  # --------------------------------------------- 3D Tiles builder (one-shot)
  # docker compose --profile tiles3d run --rm pg2b3dm
  pg2b3dm:
    image: ${PG2B3DM_IMAGE}
    profiles: [tiles3d]
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./frontend-app/public/3dtiles:/app/output
    command: >
      -h postgis -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      -t gis.buildings3d -c geom3d
      -a kind,name,height
      -o /app/output
    networks: [vibegis]

  # ----------------------------------------------- frontend (Vite dev server)
  # React + TypeScript + Resium + Mantine, with hot module reload.
  # Open http://localhost:5173/
  frontend:
    build:
      context: ./frontend-app
    container_name: vibegis-frontend
    restart: unless-stopped
    environment:
      # set to 1 if edits are not picked up (inotify can be flaky on bind mounts)
      VITE_USE_POLLING: "0"
      # port the browser reaches the app on, used for the HMR websocket
      VITE_HMR_PORT: "${GATEWAY_PORT}"
    volumes:
      - ./frontend-app:/app
      - frontend-node-modules:/app/node_modules
    # not published: the gateway proxies to it on the internal network
    expose:
      - "5173"
    networks: [vibegis]

  # ------------------------------------------- terrain builder (one-shot job)
  ctb:
    image: ${CTB_IMAGE}
    profiles: [terrain]
    volumes:
      - ./terrain:/work
    working_dir: /work
    entrypoint: ["/bin/bash", "/work/build-terrain.sh"]
    networks: [vibegis]

  # ------------------------------------------------------ pgadmin (optional)
  pgadmin:
    image: ${PGADMIN_IMAGE}
    profiles: [tools]
    restart: unless-stopped
    depends_on: [postgis]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80"
    networks: [vibegis]

volumes:
  # Pinned to their pre-rebrand names so renaming the compose project above
  # doesn't make Compose look for (and silently create empty) new volumes —
  # these hold real data (uploaded layers, Dagster's home) that must survive.
  postgis-data:
    name: webgis_postgis-data
  dagster-home:
    name: webgis_dagster-home
  pgadmin-data:
  frontend-node-modules:
  mapproxy-cache:

networks:
  vibegis:
    driver: bridge
