# VibeGIS stack: PostGIS + MapServer + QGIS Server + Dagster + Cesium
# Start:  docker compose up -d
# Tools:  docker compose --profile tools up -d      (adds pgAdmin)
# Terrain: docker compose --profile terrain run --rm ctb   (one-shot build)

name: vibegis

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

services:

  # ---------------------------------------------------------------- database
  postgis:
    image: ${POSTGIS_IMAGE}
    container_name: vibegis-postgis
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # Ceiling, not a reservation. Nothing had one before, so a single
    # oversized upload or a runaway query could take the whole host with it.
    mem_limit: 2g
    cpus: "2.0"
    environment:
      <<: *postgres-env
      # Tuning; raise shared_buffers if you give Docker more RAM
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_parallel_workers_per_gather=4
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./postgis/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [vibegis]

  # --------------------------------------------------------------- mapserver
  # Fast WMS/WMTS/OGC-API rendering. Serves imagery + Terrain-RGB to Cesium.
  mapserver:
    image: ${MAPSERVER_IMAGE}
    container_name: vibegis-mapserver
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # Ceiling, not a reservation. Nothing had one before, so a single
    # oversized upload or a runaway query could take the whole host with it.
    mem_limit: 1g
    cpus: "1.5"
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost/?SERVICE=WMS&REQUEST=GetCapabilities"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      MS_MAPFILE: /etc/mapserver/vibegis.map
      # Second lock on the client-supplied `map=` parameter, which overrides
      # MS_MAPFILE and would otherwise let a caller name any file this
      # container can read. The gateway refuses `map=` outright (see
      # nginx/locations.conf); this pattern matches nothing, so even a request
      # that reached mapserv directly on the compose network gets nowhere.
      MS_MAP_PATTERN: "^$"
      MS_MAP_NO_PATH: "1"
      MS_DEBUGLEVEL: "1"
      MS_ERRORFILE: stderr
      # consumed inside the mapfile via CONNECTION
      PGHOST: postgis
      PGDATABASE: ${POSTGRES_DB}
      # Read-only role (postgis/initdb/07-roles.sql, bin/migrate-roles.sql):
      # this service only ever SELECTs, and must not be able to reach
      # configdb or userdb at all.
      PGUSER: vibegis_render
      PGPASSWORD: ${RENDER_PG_PASSWORD}
      # Apache's default (8190) is far too small for a GetMap carrying a full
      # SLD_BODY once a layer has a user-defined classification (see
      # upload-api's /layer-config): one rule per distinct value, so a
      # 140-value column alone already runs ~88KB, well past the 65536 this
      # was previously set to for the (much smaller) hand-authored legends.
      # /distinct-values caps a classification at 500 classes; sized with
      # comfortable headroom above that worst case.
      APACHE_LIMIT_REQUEST_LINE: "2097152"
    volumes:
      - ./mapserver/mapfiles:/etc/mapserver:ro
      - ./mapserver/data:/data:ro
      # Not nested under /data: /data is itself a read-only mount, and Docker
      # can't create a mountpoint for a second bind mount inside an
      # already-read-only parent mount at container-creation time.
      - ./mapserver/rasters:/rasters:ro
    networks: [vibegis]

  # ------------------------------------------------------------- qgis server
  # Headless. Publish by dropping .qgs/.qgz files into ./qgis-server/projects
  # and requesting  ?MAP=/io/data/<project>.qgs&SERVICE=WMS&...
  qgis-server:
    image: ${QGISSERVER_IMAGE}
    container_name: vibegis-qgis-server
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # Ceiling, not a reservation. Nothing had one before, so a single
    # oversized upload or a runaway query could take the whole host with it.
    mem_limit: 1g
    cpus: "1.5"
    healthcheck:
      # No -f: QGIS Server answers a request with no MAP= with an XML exception
      # at HTTP 200 anyway, so this is a liveness check (is it accepting
      # connections), not a functional one.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      QGIS_SERVER_LOG_LEVEL: "1"
      QGIS_SERVER_LOG_STDERR: "1"
      QGIS_SERVER_PARALLEL_RENDERING: "true"
      QGIS_SERVER_MAX_THREADS: "4"
      QGIS_SERVER_CACHE_SIZE: "500000000"
      QGIS_PROJECT_FILE: ""
      PGHOST: postgis
      PGDATABASE: ${POSTGRES_DB}
      # Read-only role (postgis/initdb/07-roles.sql, bin/migrate-roles.sql):
      # this service only ever SELECTs, and must not be able to reach
      # configdb or userdb at all.
      PGUSER: vibegis_render
      PGPASSWORD: ${RENDER_PG_PASSWORD}
    volumes:
      - ./qgis-server/projects:/io/data:ro
      # Print projects generated by qgis-processing. A separate mount from
      # /io/data on purpose: that one is hand-authored and git-tracked, this
      # one is machine-written ephemera, and a MAP= path in the logs then says
      # by itself which kind it is.
      - qgis-projects:/io/generated:ro
    networks: [vibegis]

  # -------------------------------------------------- qgis processing worker
  # Runs QGIS algorithms (qgis_process) and builds print projects (PyQGIS) for
  # upload-api. Same base image as qgis-server — it already ships qgis_process
  # and PyQGIS — but with the processing plugin's missing Python deps added,
  # which is what takes the catalog from 248 native algorithms to 343.
  # No `ports:` and no nginx location, deliberately: like dagster, it is
  # reachable only from inside the compose network, and upload-api is the only
  # thing that ever calls it.
  qgis-processing:
    build:
      context: ./qgis-processing
      args:
        APP_UID: ${APP_UID:-1001}
        APP_GID: ${APP_GID:-1001}
        QGISSERVER_IMAGE: ${QGISSERVER_IMAGE}
    container_name: vibegis-qgis-processing
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # Non-root, matching the host user this repo's bind mounts belong to.
    # Set as a runtime override as well as a build arg so an operator whose
    # host uid differs can fix ownership mismatches without a rebuild.
    user: "${APP_UID:-1001}:${APP_GID:-1001}"
    # Ceiling, not a reservation. Nothing had one before, so a single
    # oversized upload or a runaway query could take the whole host with it.
    mem_limit: 3g
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PGHOST: postgis
      PGDATABASE: ${POSTGRES_DB}
      # Read-only role (postgis/initdb/07-roles.sql, bin/migrate-roles.sql):
      # this service only ever SELECTs, and must not be able to reach
      # configdb or userdb at all.
      PGUSER: vibegis_render
      # Read by libpq only. The OGR DSN this worker builds deliberately omits
      # the password, exactly like the mapfiles do.
      PGPASSWORD: ${RENDER_PG_PASSWORD}
      MAPSERVER_URL: http://mapserver/
    volumes:
      - qgis-work:/qgis-work
      - qgis-projects:/io/generated
    expose: ["8000"]
    networks: [vibegis]

  # ------------------------------------------------------------------ dagster
  dagster:
    build:
      context: ./dagster
      args:
        APP_UID: ${APP_UID:-1001}
        APP_GID: ${APP_GID:-1001}
        GDAL_IMAGE: ${GDAL_IMAGE}
    container_name: vibegis-dagster
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # Non-root, matching the host user this repo's bind mounts belong to.
    # Set as a runtime override as well as a build arg so an operator whose
    # host uid differs can fix ownership mismatches without a rebuild.
    user: "${APP_UID:-1001}:${APP_GID:-1001}"
    # Ceiling, not a reservation. Nothing had one before, so a single
    # oversized upload or a runaway query could take the whole host with it.
    mem_limit: 2g
    cpus: "2.0"
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      <<: *postgres-env
      POSTGRES_HOST: postgis
      DAGSTER_HOME: /opt/dagster/home
    volumes:
      - ./dagster:/opt/dagster/app
      - dagster-home:/opt/dagster/home
      - ./mapserver/data:/data/raster
      - ./terrain/dem:/data/dem
    ports:
      - "127.0.0.1:${DAGSTER_PORT}:3000"
    networks: [vibegis]

  # -------------------------------------------------------------- upload-api
  # Turns an uploaded shapefile/GeoPackage/GeoJSON/KML/GML into a PostGIS
  # table (schema "raw") plus a LAYER block appended to
  # mapserver/mapfiles/uploads.map — MapServer re-parses its mapfile on every
  # request, so the new layer shows up in GetCapabilities immediately.
  upload-api:
    build:
      context: ./upload-api
      args:
        APP_UID: ${APP_UID:-1001}
        APP_GID: ${APP_GID:-1001}
        GDAL_IMAGE: ${GDAL_IMAGE}
    container_name: vibegis-upload-api
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # Non-root, matching the host user this repo's bind mounts belong to.
    # Set as a runtime override as well as a build arg so an operator whose
    # host uid differs can fix ownership mismatches without a rebuild.
    user: "${APP_UID:-1001}:${APP_GID:-1001}"
    # Ceiling, not a reservation. Nothing had one before, so a single
    # oversized upload or a runaway query could take the whole host with it.
    mem_limit: 3g
    cpus: "2.0"
    healthcheck:
      # Its own unauthenticated liveness route — /health needs a session and a
      # healthcheck has no cookie. python3 comes from the GDAL base image; this
      # image has no curl.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PGHOST: postgis
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AI_KEY_ENCRYPTION_SECRET: ${AI_KEY_ENCRYPTION_SECRET}
      AI_READONLY_PG_PASSWORD: ${AI_READONLY_PG_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - ./mapserver/mapfiles:/mapfiles
      # Read-write, unlike mapserver's own :ro mount of the same host path —
      # this is what lets POST /upload-raster land a normalized GeoTIFF
      # somewhere mapserver can then read it from.
      - ./mapserver/rasters:/rasters
      # Point-cloud tilesets published by POST /upload-pointcloud. Top-level,
      # not under frontend-app/public/ (Vite would watch and serve gigabytes)
      # and not under mapserver/ — MapServer cannot render .pnts and has no
      # business seeing these. Only upload-api (writes) and gateway (serves,
      # read-only) mount it.
      - ./pointclouds:/pointclouds
      # Styling is written here, so tile invalidation has to happen here too:
      # MapProxy exposes no purge endpoint, so a restyle deletes the layer's
      # cache directory directly. See purge_layer_cache() in upload-api/app.py.
      # GeoPackages written by qgis-processing, read back here and loaded
      # into dwh. Shared named volume rather than a bind mount: nothing in it
      # belongs in git, and a named volume cannot go stale the way this repo's
      # bind mounts have.
      - qgis-work:/qgis-work
      - mapproxy-cache:/mapproxy-cache
      # Read-write, unlike mapproxy's own :ro mount of the same host path —
      # this is what lets generate_mapproxy_config() add a layer/cache/source
      # for every layer this service publishes.
      - ./mapproxy:/mapproxy-config
    expose:
      - "8000"
    networks: [vibegis]

  # ------------------------------------------------------------------ gateway
  # Single origin for the browser -> no CORS problems in Cesium.
  gateway:
    image: ${NGINX_IMAGE}
    container_name: vibegis-gateway
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1
      # first and nginx here only listens on IPv4, so "localhost" fails with
      # "Connection refused" while the service is perfectly healthy.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      # Only upload-api gets a real readiness gate: the gateway calls it for
      # auth_request on every gated route, so starting before it is ready means
      # 500s on the first requests. The others resolve at request time (see the
      # `resolver` directive in nginx.conf), so start-order is enough.
      upload-api:
        condition: service_healthy
      mapserver:
        condition: service_started
      qgis-server:
        condition: service_started
      frontend:
        condition: service_started
    volumes:
      # default.conf is the server block; the two partials it includes hold
      # the settings and every route, shared with the TLS config so the HTTP
      # and HTTPS gateways cannot drift (see docker-compose.tls.yml). They
      # live outside conf.d deliberately — the nginx image includes
      # conf.d/*.conf at http level, where a bare `location` is a syntax error.
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/server-settings.conf:/etc/nginx/vibegis/server-settings.conf:ro
      - ./nginx/locations.conf:/etc/nginx/vibegis/locations.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/vibegis/security-headers.conf:ro
      - ./terrain/tiles:/usr/share/nginx/terrain:ro
      - ./frontend-app/public/3dtiles:/usr/share/nginx/tiles3d:ro
      - ./pointclouds:/usr/share/nginx/pointclouds:ro
    ports:
      - "${GATEWAY_PORT}:80"
    networks: [vibegis]

  # ------------------------------------------------------ tile cache (WMS)
  # Caches MapServer output on disk. mapproxy.yaml here is machine-written by
  # upload-api (generate_mapproxy_config() in upload-api/app.py) — every layer
  # it publishes gets a layer/cache/source triple automatically. A dirty diff
  # is expected, same as uploads.map/layer_config.json; don't hand-edit while
  # the stack is up.
  mapproxy:
    build:
      context: ./mapproxy
      args:
        APP_UID: ${APP_UID:-1001}
        APP_GID: ${APP_GID:-1001}
    container_name: vibegis-mapproxy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # Non-root, matching the host user this repo's bind mounts belong to.
    # Set as a runtime override as well as a build arg so an operator whose
    # host uid differs can fix ownership mismatches without a rebuild.
    user: "${APP_UID:-1001}:${APP_GID:-1001}"
    # Ceiling, not a reservation. Nothing had one before, so a single
    # oversized upload or a runaway query could take the whole host with it.
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8080/service?SERVICE=WMS&REQUEST=GetCapabilities', timeout=5); sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on: [mapserver]
    volumes:
      - ./mapproxy:/mapproxy/config:ro
      - mapproxy-cache:/mapproxy/cache_data
    expose:
      - "8080"
    networks: [vibegis]

  # ------------------------------------------------- OGC API Features (JSON)
  # Publishes PostGIS tables and functions as GeoJSON. Used by the search box.
  featureserv:
    image: ${FEATURESERV_IMAGE}
    container_name: vibegis-featureserv
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      # Read-only role (postgis/initdb/07-roles.sql, bin/migrate-roles.sql):
      # this service only ever SELECTs, and must not be able to reach
      # configdb or userdb at all.
      DATABASE_URL: "postgresql://vibegis_render:${RENDER_PG_PASSWORD}@postgis:5432/${POSTGRES_DB}"
      PGFS_SERVER_HTTPPORT: "9000"
      PGFS_SERVER_BASEPATH: "/features"
      PGFS_PAGING_LIMITMAX: "1000"
    expose:
      - "9000"
    networks: [vibegis]

  # --------------------------------------------- 3D Tiles builder (one-shot)
  # docker compose --profile tiles3d run --rm pg2b3dm
  pg2b3dm:
    image: ${PG2B3DM_IMAGE}
    security_opt: [no-new-privileges:true]
    profiles: [tiles3d]
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PGPASSWORD: ${RENDER_PG_PASSWORD}
    volumes:
      - ./frontend-app/public/3dtiles:/app/output
    command: >
      -h postgis -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      -t dwh.buildings3d -c geom3d
      -a kind,name,height
      -o /app/output
    networks: [vibegis]

  # ----------------------------------------------- frontend (Vite dev server)
  # React + TypeScript + Resium + Mantine, with hot module reload.
  # Open http://localhost:5173/
  frontend:
    build:
      context: ./frontend-app
    container_name: vibegis-frontend
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # Ceiling, not a reservation. Nothing had one before, so a single
    # oversized upload or a runaway query could take the whole host with it.
    mem_limit: 2g
    cpus: "1.0"
    healthcheck:
      # 127.0.0.1 for the same busybox/IPv6 reason as the gateway above.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      # set to 1 if edits are not picked up (inotify can be flaky on bind mounts)
      VITE_USE_POLLING: "0"
      # port the browser reaches the app on, used for the HMR websocket
      VITE_HMR_PORT: "${GATEWAY_PORT}"
    volumes:
      - ./frontend-app:/app
      - frontend-node-modules:/app/node_modules
    # not published: the gateway proxies to it on the internal network
    expose:
      - "5173"
    networks: [vibegis]

  # ------------------------------------------- terrain builder (one-shot job)
  ctb:
    image: ${CTB_IMAGE}
    security_opt: [no-new-privileges:true]
    profiles: [terrain]
    volumes:
      - ./terrain:/work
    working_dir: /work
    entrypoint: ["/bin/bash", "/work/build-terrain.sh"]
    networks: [vibegis]

  # -------------------------------------------------------------- log store
  # Centralized logging (see CLAUDE.md's logging note): every service's
  # stdout/stderr, searchable in one place instead of per-container
  # `docker compose logs`. Loki stores and indexes, Promtail ships,
  # Grafana views. Real added infrastructure — three more containers.
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.2.1}
    container_name: vibegis-loki
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # Ceiling, not a reservation. Nothing had one before, so a single
    # oversized upload or a runaway query could take the whole host with it.
    mem_limit: 1g
    cpus: "1.0"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    expose:
      - "3100"
    networks: [vibegis]

  # ------------------------------------------------------------ log shipper
  # Reads every container's logs by talking to the Docker Engine API over
  # the (read-only) socket mount, not by reading json-file logs off disk —
  # that would depend on exactly where Docker Desktop's VM keeps them.
  # Talking to the API works the same regardless of host/driver, and needs
  # nothing installed on the host (unlike Loki's own Docker logging-driver
  # plugin, which needs `docker plugin install`).
  # ------------------------------------------------- docker socket proxy
  # promtail and docker-stats-exporter both need the Docker Engine API, and
  # both used to get it by bind-mounting /var/run/docker.sock directly. The
  # `:ro` on that mount is about the socket *file*, not the API: anything that
  # can talk to the socket can also `docker inspect` every other container and
  # read its environment in plaintext — which is where PGPASSWORD,
  # AUTH_JWT_SECRET and AI_KEY_ENCRYPTION_SECRET all live — and can create a
  # privileged container, the classic host escape. A code-execution bug in
  # either of those two small collectors was therefore a compromise of the
  # whole stack.
  #
  # This proxy is a tiny HAProxy in front of the socket that allows only the
  # endpoints they actually use. CONTAINERS=1 covers /containers/json,
  # /containers/{id}/json, /containers/{id}/logs and /containers/{id}/stats.
  # Everything else — images, exec, volumes, networks, and every POST — stays
  # denied, so neither collector can inspect another container's environment
  # or start anything.
  docker-socket-proxy:
    image: ${SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:0.3.0}
    container_name: vibegis-docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      # Everything below is denied explicitly rather than by omission, so the
      # intent survives an image default changing.
      POST: "0"
      EXEC: "0"
      IMAGES: "0"
      VOLUMES: "0"
      # promtail's docker_sd_configs computes network labels for every target,
      # which needs the (read-only) network listing — without it discovery 403s
      # and no container logs are shipped at all. Networks expose topology, not
      # secrets, unlike the container-inspect data this proxy exists to keep out
      # of reach.
      NETWORKS: "1"
      SERVICES: "0"
      TASKS: "0"
      SECRETS: "0"
      CONFIGS: "0"
      SWARM: "0"
      NODES: "0"
      PLUGINS: "0"
      SYSTEM: "0"
      INFO: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      DISTRIBUTION: "0"
      SESSION: "0"
    volumes:
      # The one place the raw socket is still mounted. Read-only, and nothing
      # but HAProxy runs in this container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt: [no-new-privileges:true]
    networks: [vibegis]

  promtail:
    image: ${PROMTAIL_IMAGE:-grafana/promtail:3.2.1}
    container_name: vibegis-promtail
    restart: unless-stopped
    # Same as docker-stats-exporter: the Docker API now comes through
    # docker-socket-proxy, not a raw socket mount.
    depends_on: [loki, docker-socket-proxy]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks: [vibegis]

  # ------------------------------------------------------------- log viewer
  # 127.0.0.1-only, same treatment as Dagster/PostGIS above — not proxied
  # through the public gateway.
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.3.1}
    container_name: vibegis-grafana
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # Ceiling, not a reservation. Nothing had one before, so a single
    # oversized upload or a runaway query could take the whole host with it.
    mem_limit: 512m
    cpus: "0.5"
    depends_on: [loki, prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Explicit, though it is Grafana's default: this instance has exactly one
      # account, provisioned below, and nobody signs themselves up for it.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # `:?` on purpose, not a default. This used to be
      # `${GRAFANA_ADMIN_PASSWORD:-admin}`, so an install that simply never set
      # the variable — the likely case, since it is easy to miss in .env —
      # booted Grafana with admin/admin and said nothing. Compose now refuses
      # to start and names the variable.
      #
      # Note it only takes effect when Grafana initialises its database. On an
      # existing grafana-data volume the password is whatever it was first set
      # to; change it in the UI, or:
      #   docker compose exec grafana grafana-cli admin reset-admin-password '<new>'
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env — see .env.example}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    networks: [vibegis]

  # ------------------------------------------------------- resource metrics
  # Polls the Docker Engine API (/containers/{id}/stats) over the same
  # read-only socket mount promtail already uses for log discovery, and
  # exposes Prometheus metrics labeled the same way promtail labels its log
  # streams (service = Compose service name) — see
  # docker-stats-exporter/exporter.py for why this exists instead of
  # cAdvisor: cAdvisor needs direct cgroup/overlay2 filesystem access, which
  # Docker Desktop's isolated-VM engine doesn't expose to a sibling
  # container, confirmed by live testing (it only ever saw empty host
  # cgroup slices, never the real vibegis-* containers).
  docker-stats-exporter:
    build:
      context: ./docker-stats-exporter
      args:
        APP_UID: ${APP_UID:-1001}
        APP_GID: ${APP_GID:-1001}
    container_name: vibegis-docker-stats-exporter
    restart: unless-stopped
    # No Docker socket mount any more — it polls the API through
    # docker-socket-proxy, which only exposes the /containers endpoints.
    depends_on: [docker-socket-proxy]
    security_opt: [no-new-privileges:true]
    # Non-root, matching the host user this repo's bind mounts belong to.
    # Set as a runtime override as well as a build arg so an operator whose
    # host uid differs can fix ownership mismatches without a rebuild.
    user: "${APP_UID:-1001}:${APP_GID:-1001}"
    expose:
      - "9100"
    networks: [vibegis]

  # Scrapes docker-stats-exporter and stores the time series Grafana's
  # Prometheus datasource queries. No host install (image only), matching
  # this repo's "nothing to install on the host" rule.
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.55.1}
    container_name: vibegis-prometheus
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # Ceiling, not a reservation. Nothing had one before, so a single
    # oversized upload or a runaway query could take the whole host with it.
    mem_limit: 1g
    cpus: "1.0"
    depends_on: [docker-stats-exporter]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks: [vibegis]

  # ------------------------------------------------------ pgadmin (optional)
  pgadmin:
    image: ${PGADMIN_IMAGE}
    profiles: [tools]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    depends_on: [postgis]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80"
    networks: [vibegis]

volumes:
  # Pinned to their pre-rebrand names so renaming the compose project above
  # doesn't make Compose look for (and silently create empty) new volumes —
  # these hold real data (uploaded layers, Dagster's home) that must survive.
  postgis-data:
    name: webgis_postgis-data
  dagster-home:
    name: webgis_dagster-home
  pgadmin-data:
  frontend-node-modules:
  mapproxy-cache:
  qgis-work:
  qgis-projects:
  loki-data:
  grafana-data:
  prometheus-data:

networks:
  vibegis:
    driver: bridge
