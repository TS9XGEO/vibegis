# Single origin for the browser. Everything the app needs is reachable under
# http://localhost:8080/ so there is no CORS to configure.
#
# "/" is proxied to the Vite dev server (React app, hot reload).
# The OGC endpoints are proxied to their respective containers.

# Docker's embedded DNS. Resolving upstreams at request time rather than at
# startup means nginx still boots if the frontend container is not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 512M;

    # The recolor-legend/classification features send a generated SLD as an
    # SLD_BODY query parameter on GetMap requests (see
    # frontend-app/src/legend.ts). A layer classified on a high-cardinality
    # column emits one Rule per distinct value — /distinct-values caps that
    # at 500 classes, which can run past 400KB — so this needs real headroom,
    # matched to APACHE_LIMIT_REQUEST_LINE in docker-compose.yml.
    large_client_header_buffers 4 2048k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---------------------------------------------------------- mapserver
    # http://localhost:8080/mapserver?SERVICE=WMS&REQUEST=GetCapabilities
    location /mapserver {
        set $ms http://mapserver;
        proxy_pass $ms$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------------- tile cache
    # Same WMS layer names as MapServer, but served from disk cache.
    # http://localhost:8080/tiles/service?SERVICE=WMS&...
    # Demo/preview UI at http://localhost:8080/tiles/demo/
    location /tiles/ {
        set $mp http://mapproxy:8080;
        proxy_pass $mp$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Script-Name /tiles;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------- OGC API Features
    # http://localhost:8080/features/collections
    # Search: /features/functions/search/items?q=Marienplatz&limit=10
    location /features {
        set $fs http://featureserv:9000;
        proxy_pass $fs$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # -------------------------------------------------------- layer upload
    # http://localhost:8080/upload  (multipart POST, see UploadLayer.tsx)
    # Geodata files (shapefiles, GeoPackages) commonly run into the hundreds
    # of MB, well past the server-wide 512M default — and reading/reprojecting/
    # loading one into PostGIS can take a while, hence the longer timeout.
    location /upload {
        client_max_body_size 2048M;
        proxy_read_timeout 300s;
        set $ua http://upload-api:8000;
        proxy_pass $ua/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # http://localhost:8080/tables               (GET: existing DB tables)
    # http://localhost:8080/register-table        (POST)
    # http://localhost:8080/layers, /layers/<name> (GET, DELETE)
    # http://localhost:8080/distinct-values        (GET: filter builder's value list)
    location /tables {
        set $ua http://upload-api:8000;
        proxy_pass $ua;
        proxy_set_header Host $host;
    }
    location /distinct-values {
        set $ua http://upload-api:8000;
        proxy_pass $ua;
        proxy_set_header Host $host;
    }
    location /column-stats {
        set $ua http://upload-api:8000;
        proxy_pass $ua;
        proxy_set_header Host $host;
    }
    location /layer-config {
        set $ua http://upload-api:8000;
        proxy_pass $ua;
        proxy_set_header Host $host;
    }
    location /register-table {
        set $ua http://upload-api:8000;
        proxy_pass $ua;
        proxy_set_header Host $host;
    }
    location /layers {
        set $ua http://upload-api:8000;
        proxy_pass $ua;
        proxy_set_header Host $host;
    }

    # -------------------------------------------------------- qgis server
    location /qgis {
        set $qg http://qgis-server;
        proxy_pass $qg$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------ quantized-mesh terrain
    # CTB writes gzip-compressed .terrain files, so they are served with
    # Content-Encoding: gzip. Do not re-compress them.
    #
    # The .terrain rule must not be nested inside /terrain/ using alias the
    # same way the parent does: alias inside a *regex* location has to have
    # the matched path captured and interpolated explicitly, or nginx
    # mis-resolves the filesystem path and 301-redirects it as if it were a
    # directory (this used to 301 every tile request to a URL with no port,
    # which the browser then couldn't even connect to).
    location ~ ^/terrain/(.*\.terrain)$ {
        alias /usr/share/nginx/terrain/$1;
        add_header Content-Encoding gzip;
        add_header Content-Type application/octet-stream;
        add_header Access-Control-Allow-Origin *;
        expires 7d;
    }

    location /terrain/ {
        alias /usr/share/nginx/terrain/;
        add_header Access-Control-Allow-Origin *;
        expires 7d;
    }

    # --------------------------------------------------------- 3D Tiles
    location /3dtiles/ {
        alias /usr/share/nginx/tiles3d/;
        add_header Access-Control-Allow-Origin *;
        expires 1d;
    }

    # --------------------------------------------------- the React app
    # Proxied to the Vite dev server. The Upgrade headers are what make hot
    # module reload work through the proxy — without them the HMR websocket
    # fails and you silently lose live reloading.
    location / {
        set $fe http://frontend:5173;
        proxy_pass $fe$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}
