# Single origin for the browser. Everything the app needs is reachable under
# http://localhost:8080/ so there is no CORS to configure.
#
# "/" is proxied to the Vite dev server (React app, hot reload).
# The OGC endpoints are proxied to their respective containers.

# Docker's embedded DNS. Resolving upstreams at request time rather than at
# startup means nginx still boots if the frontend container is not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 512M;

    # The recolor-legend/classification features send a generated SLD as an
    # SLD_BODY query parameter on GetMap requests (see
    # frontend-app/src/legend.ts). A layer classified on a high-cardinality
    # column emits one Rule per distinct value — /distinct-values caps that
    # at 500 classes, which can run past 400KB — so this needs real headroom,
    # matched to APACHE_LIMIT_REQUEST_LINE in docker-compose.yml.
    large_client_header_buffers 4 2048k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---------------------------------------------------------------- auth
    # Real per-user accounts (JWT cookie, admin/viewer roles) live in
    # upload-api. Services below with no app code of their own (mapserver,
    # mapproxy, pg_featureserv, qgis-server, static terrain/3dtiles) can't
    # check the cookie themselves, so nginx gates them with auth_request
    # against this internal subrequest target. upload-api's own routes
    # enforce auth in-process instead (see CLAUDE.md "Things that will bite
    # you") — cheaper, and the only way to express the admin-vs-viewer
    # distinction, which auth_request's plain 200/401 can't.
    location = /auth/verify {
        internal;
        proxy_pass http://upload-api:8000/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }
    # Reachable with no session — otherwise there'd be no way to get one.
    location = /login {
        set $ua http://upload-api:8000;
        proxy_pass $ua/login;
        proxy_set_header Host $host;
    }
    location = /logout {
        set $ua http://upload-api:8000;
        proxy_pass $ua/logout;
        proxy_set_header Host $host;
    }
    location = /auth/me {
        set $ua http://upload-api:8000;
        proxy_pass $ua/auth/me;
        proxy_set_header Host $host;
    }
    # Admin-only account management (enforced in upload-api, not here).
    location /users {
        set $ua http://upload-api:8000;
        proxy_pass $ua;
        proxy_set_header Host $host;
    }
    # Premium/admin-gated ETL trigger (enforced in upload-api, not here).
    location /etl/ {
        set $ua http://upload-api:8000;
        proxy_pass $ua;
        proxy_set_header Host $host;
    }

    # ---------------------------------------------------------- mapserver
    # http://localhost:8080/mapserver?SERVICE=WMS&REQUEST=GetCapabilities
    location /mapserver {
        auth_request /auth/verify;
        set $ms http://mapserver;
        proxy_pass $ms$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------------- tile cache
    # Same WMS layer names as MapServer, but served from disk cache.
    # http://localhost:8080/tiles/service?SERVICE=WMS&...
    # Demo/preview UI at http://localhost:8080/tiles/demo/
    location /tiles/ {
        auth_request /auth/verify;
        set $mp http://mapproxy:8080;
        proxy_pass $mp$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Script-Name /tiles;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------- OGC API Features
    # http://localhost:8080/features/collections
    # Search: /features/functions/search/items?q=Marienplatz&limit=10
    location /features {
        auth_request /auth/verify;
        set $fs http://featureserv:9000;
        proxy_pass $fs$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # -------------------------------------------------------- layer upload
    # http://localhost:8080/upload  (multipart POST, see UploadLayer.tsx)
    # Geodata files (shapefiles, GeoPackages) commonly run into the hundreds
    # of MB, well past the server-wide 512M default — and reading/reprojecting/
    # loading one into PostGIS can take a while, hence the longer timeout.
    location /upload {
        client_max_body_size 2048M;
        proxy_read_timeout 300s;
        set $ua http://upload-api:8000;
        proxy_pass $ua/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -------------------------------------------------------- raster upload
    # http://localhost:8080/upload-raster  (multipart POST, see UploadLayer.tsx)
    # Same large-file profile as /upload — a GeoTIFF upload additionally runs
    # gdalwarp + gdaladdo server-side before it's published.
    location /upload-raster {
        client_max_body_size 2048M;
        proxy_read_timeout 300s;
        set $ua http://upload-api:8000;
        proxy_pass $ua/upload-raster;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # http://localhost:8080/upload-raster-zip  (multipart POST, see UploadLayer.tsx)
    # Same profile as /upload-raster, but proxy_read_timeout is longer — a
    # request with several composites runs multiple GDAL passes back to back.
    location /upload-raster-zip {
        client_max_body_size 2048M;
        proxy_read_timeout 600s;
        set $ua http://upload-api:8000;
        proxy_pass $ua/upload-raster-zip;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # http://localhost:8080/raster-composite  (JSON POST, see LayerPanel.tsx)
    # Plain JSON body, no file involved — same minimal profile as /geoprocess.
    location /raster-composite {
        set $ua http://upload-api:8000;
        proxy_pass $ua;
        proxy_set_header Host $host;
    }

    # http://localhost:8080/tables               (GET: existing DB tables)
    # http://localhost:8080/register-table        (POST)
    # http://localhost:8080/layers, /layers/<name> (GET, DELETE)
    # http://localhost:8080/distinct-values        (GET: filter builder's value list)
    location /tables {
        set $ua http://upload-api:8000;
        proxy_pass $ua;
        proxy_set_header Host $host;
    }
    location /distinct-values {
        set $ua http://upload-api:8000;
        proxy_pass $ua;
        proxy_set_header Host $host;
    }
    location /column-stats {
        set $ua http://upload-api:8000;
        proxy_pass $ua;
        proxy_set_header Host $host;
    }
    location /column-groupby {
        set $ua http://upload-api:8000;
        proxy_pass $ua;
        proxy_set_header Host $host;
    }
    location /table-count {
        set $ua http://upload-api:8000;
        proxy_pass $ua;
        proxy_set_header Host $host;
    }
    location /layer-config {
        set $ua http://upload-api:8000;
        proxy_pass $ua;
        proxy_set_header Host $host;
    }
    location /register-table {
        set $ua http://upload-api:8000;
        proxy_pass $ua;
        proxy_set_header Host $host;
    }
    location /geoprocess {
        set $ua http://upload-api:8000;
        proxy_pass $ua;
        proxy_set_header Host $host;
    }
    location /layers {
        set $ua http://upload-api:8000;
        proxy_pass $ua;
        proxy_set_header Host $host;
    }
    # Exact match: "/health" would otherwise fall through to the catch-all and
    # return the React index.html, which looks like the app is fine no matter
    # what upload-api thinks. It reports whether the mapfile bind mount is live
    # — the one failure that leaves the service running and answering normally.
    location = /health {
        set $ua http://upload-api:8000;
        proxy_pass $ua;
        proxy_set_header Host $host;
    }

    # -------------------------------------------------------- qgis server
    location /qgis {
        auth_request /auth/verify;
        set $qg http://qgis-server;
        proxy_pass $qg$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------ quantized-mesh terrain
    # CTB writes gzip-compressed .terrain files, so they are served with
    # Content-Encoding: gzip. Do not re-compress them.
    #
    # The .terrain rule must not be nested inside /terrain/ using alias the
    # same way the parent does: alias inside a *regex* location has to have
    # the matched path captured and interpolated explicitly, or nginx
    # mis-resolves the filesystem path and 301-redirects it as if it were a
    # directory (this used to 301 every tile request to a URL with no port,
    # which the browser then couldn't even connect to).
    location ~ ^/terrain/(.*\.terrain)$ {
        auth_request /auth/verify;
        alias /usr/share/nginx/terrain/$1;
        add_header Content-Encoding gzip;
        add_header Content-Type application/octet-stream;
        add_header Access-Control-Allow-Origin *;
        expires 7d;
    }

    location /terrain/ {
        auth_request /auth/verify;
        alias /usr/share/nginx/terrain/;
        add_header Access-Control-Allow-Origin *;
        expires 7d;
    }

    # --------------------------------------------------------- 3D Tiles
    location /3dtiles/ {
        auth_request /auth/verify;
        alias /usr/share/nginx/tiles3d/;
        add_header Access-Control-Allow-Origin *;
        expires 1d;
    }

    # --------------------------------------------------- the React app
    # Proxied to the Vite dev server. The Upgrade headers are what make hot
    # module reload work through the proxy — without them the HMR websocket
    # fails and you silently lose live reloading.
    location / {
        set $fe http://frontend:5173;
        proxy_pass $fe$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}
