# Single origin for the browser. Everything the app needs is reachable under
# http://localhost:8080/ so there is no CORS to configure.
#
# "/" is proxied to the Vite dev server (React app, hot reload).
# The OGC endpoints are proxied to their respective containers.

# Docker's embedded DNS. Resolving upstreams at request time rather than at
# startup means nginx still boots if the frontend container is not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Structured-ish access log: adds $request_id (nginx's own, forwarded below
# as X-Request-Id so upload-api can log the same id against its own
# request) plus request/upstream timing, so a slow request can be traced
# from the gateway through to whichever backend served it. Was running on
# nginx's compiled-in default format before this.
log_format main_with_timing
    '$remote_addr - $request_id [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';
access_log /var/log/nginx/access.log main_with_timing;

# Rate-limit zones. http-level, so they live in the server config rather than
# in locations.conf, which is included inside `server { }` — but the
# `limit_req`/`limit_conn` directives that use them are in locations.conf, so
# both server configs must define the same zones or the shared locations file
# will not load.
#
# $binary_remote_addr, not $remote_addr: 4 bytes per client instead of up to
# 15, which is what makes a 10m zone hold ~160k clients.
limit_req_zone  $binary_remote_addr zone=login:10m   rate=10r/m;
limit_req_zone  $binary_remote_addr zone=ai:10m      rate=30r/m;
limit_conn_zone $binary_remote_addr zone=uploads:10m;


server {
    listen 80;
    server_name _;

    include /etc/nginx/vibegis/server-settings.conf;
    include /etc/nginx/vibegis/locations.conf;
}
