# Auto-provisions the Prometheus datasource on Grafana startup, same
# mechanism as loki.yaml. Backs the resource-usage panels in the
# "VibeGIS — Services" dashboard (provisioning/dashboards/).
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: true
