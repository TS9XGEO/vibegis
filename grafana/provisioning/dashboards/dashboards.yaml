# Points Grafana at this same directory for dashboard JSON files. Polls for
# changes every 10s, so editing a dashboard JSON on disk just works — no
# restart needed, same "machine-writes, live-reloads" spirit as
# mapproxy/mapproxy.yaml.
apiVersion: 1

providers:
  - name: vibegis
    folder: ""
    type: file
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/provisioning/dashboards
