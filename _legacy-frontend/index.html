<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGIS — Cesium</title>

<link rel="stylesheet" href="https://unpkg.com/cesium/Build/Cesium/Widgets/widgets.css">
<script>window.CESIUM_BASE_URL = 'https://unpkg.com/cesium/Build/Cesium/';</script>
<script src="https://unpkg.com/cesium/Build/Cesium/Cesium.js"></script>

<style>
  :root{
    --bg:rgba(18,21,26,.90);
    --line:rgba(255,255,255,.12);
    --txt:#e8ecf1;
    --dim:#9aa6b4;
    --accent:#7ec8ff;
    --bad:#ff8a7a;
  }
  html,body,#cesiumContainer{width:100%;height:100%;margin:0;padding:0;overflow:hidden}
  body{font:13px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--txt)}

  /* ---------------- layer panel ---------------- */
  #panel{
    position:absolute;top:10px;left:10px;z-index:20;width:290px;
    background:var(--bg);border:1px solid var(--line);border-radius:8px;
    backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.45);
    display:flex;flex-direction:column;max-height:calc(100% - 20px)
  }
  #panelHead{
    display:flex;align-items:center;gap:8px;padding:9px 12px;
    border-bottom:1px solid var(--line);cursor:pointer;user-select:none
  }
  #panelHead b{font-size:13px;font-weight:600;flex:1}
  #panelHead .chev{color:var(--dim);transition:transform .15s}
  #panel.collapsed .chev{transform:rotate(-90deg)}
  #panel.collapsed #panelBody{display:none}
  #panel.collapsed #panelHead{border-bottom:0}
  #panelBody{overflow-y:auto;padding:6px 0 10px}

  .section{padding:8px 12px 2px}
  .section > h4{
    margin:0 0 6px;font-size:10.5px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;color:var(--dim)
  }

  .node{padding:1px 0}
  .node.group > .row{font-weight:600}
  .node .children{margin-left:15px;border-left:1px solid var(--line);padding-left:8px}

  .row{display:flex;align-items:center;gap:7px;padding:3px 2px;border-radius:4px}
  .row:hover{background:rgba(255,255,255,.05)}
  .grip{
    cursor:grab;color:rgba(255,255,255,.28);user-select:none;
    font-size:12px;line-height:1;letter-spacing:-1px;padding:0 1px
  }
  .row:hover .grip{color:var(--dim)}
  .grip:active{cursor:grabbing}
  .node.dragging{opacity:.4}
  .node.dropbefore{box-shadow:inset 0 2px 0 0 var(--accent)}
  .node.dropafter{box-shadow:inset 0 -2px 0 0 var(--accent)}
  .row label{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row input[type=checkbox]{accent-color:var(--accent);cursor:pointer;margin:0}
  .row .zoom{
    opacity:0;cursor:pointer;color:var(--dim);background:none;border:0;
    font-size:13px;padding:0 2px;line-height:1
  }
  .row:hover .zoom{opacity:1}
  .row .zoom:hover{color:var(--accent)}

  .opacity{display:flex;align-items:center;gap:6px;padding:1px 2px 4px 22px}
  .opacity input{flex:1;accent-color:var(--accent);height:3px;cursor:pointer}
  .opacity span{font-size:10.5px;color:var(--dim);min-width:32px;text-align:right;
                font-variant-numeric:tabular-nums}

  .toggle{display:flex;align-items:center;gap:7px;padding:3px 2px}
  .toggle label{flex:1;cursor:pointer}
  .toggle input{accent-color:var(--accent);cursor:pointer;margin:0}
  .toggle input:disabled + label{color:var(--dim)}
  .hint{color:var(--dim);font-size:11px;padding:3px 2px 6px;line-height:1.35}
  .err{color:var(--bad);font-size:11.5px;padding:4px 2px;line-height:1.4}

  /* ---------------- hud ---------------- */
  #hud{
    position:absolute;bottom:10px;left:10px;z-index:20;
    background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;backdrop-filter:blur(8px);min-width:190px
  }
  #hud .r{display:flex;justify-content:space-between;gap:16px}
  #hud b{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
  #hud .m{margin-top:5px;padding-top:5px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="cesiumContainer"></div>

<div id="panel">
  <div id="panelHead">
    <span class="chev">&#9662;</span><b>Layer</b>
    <span id="count" style="color:#9aa6b4;font-size:11px"></span>
  </div>
  <div id="panelBody">
    <div class="section"><h4>Daten</h4><div id="tree"><div class="hint">lade Capabilities&hellip;</div></div></div>
    <div class="section"><h4>3D</h4><div id="threed"></div></div>
    <div class="section"><h4>Hintergrund</h4><div id="base"></div></div>
  </div>
</div>

<div id="hud">
  <div class="r"><span>H&ouml;he</span><b id="alt">&ndash;</b></div>
  <div class="r"><span>Lat / Lon</span><b id="pos">&ndash;</b></div>
  <div class="r m"><span>Modus</span><b id="mode">&ndash;</b></div>
</div>

<div id="errbox" style="position:absolute;right:10px;bottom:10px;z-index:30;max-width:44%;
     max-height:40%;overflow:auto;background:rgba(60,10,10,.92);border:1px solid #a44;
     border-radius:8px;padding:8px 12px;font:11.5px/1.45 ui-monospace,monospace;
     color:#ffd2cc;white-space:pre-wrap;display:none"></div>

<script>
// Surface errors on screen — no devtools needed.
(function () {
  const box = document.getElementById('errbox');
  function show(msg) {
    box.style.display = 'block';
    box.textContent += (box.textContent ? '\n\n' : '') + msg;
  }
  window.addEventListener('error', function (e) {
    show('ERROR: ' + e.message + '\n  ' + (e.filename || '') + ':' + (e.lineno || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    const r = e.reason;
    show('PROMISE: ' + (r && (r.message || r)) + (r && r.stack ? '\n' + r.stack : ''));
  });
})();
</script>

<script>
(async function () {
  'use strict';

  // ------------------------------------------------------------------ config
  const WMS_URL = '/mapserver';
  const TERRAIN = '/terrain';
  const TILES3D = '/3dtiles/tileset.json';

  const H_TERRAIN = 300000;   // m — above this: flat ellipsoid
  const H_3DTILES = 15000;    // m — below this: show 3D Tiles

  // advertised layers that should start switched off
  const DEFAULT_OFF = new Set(['dem']);

  Cesium.Ion.defaultAccessToken = undefined;

  // ------------------------------------------------------------------ viewer
  const flatTerrain = new Cesium.EllipsoidTerrainProvider();

  const viewer = new Cesium.Viewer('cesiumContainer', {
    terrainProvider: flatTerrain,
    baseLayerPicker: false,
    geocoder: false,
    homeButton: true,
    sceneModePicker: true,
    navigationHelpButton: false,
    timeline: false,
    animation: false,
    infoBox: true,
    selectionIndicator: true,
    baseLayer: false
  });

  const scene = viewer.scene;
  scene.globe.baseColor = Cesium.Color.fromCssColorString('#1b2c40');

  // Swapping the terrain provider tears down and rebuilds the whole globe
  // surface, so every imagery tile has to be re-requested. Assigning the same
  // provider again triggers that for nothing — guard against it.
  function setTerrain(p) {
    if (scene.terrainProvider !== p) scene.terrainProvider = p;
  }
  scene.globe.depthTestAgainstTerrain = true;
  scene.globe.enableLighting = false;
  scene.fog.enabled = true;
  scene.postProcessStages.fxaa.enabled = true;

  // -------------------------------------------------------- capabilities i/o
  function kids(el, localName) {
    return Array.prototype.filter.call(el.children, function (c) {
      return c.localName === localName;
    });
  }
  function firstText(el, localName) {
    const k = kids(el, localName);
    return k.length ? k[0].textContent.trim() : null;
  }

  function parseLayer(el) {
    const bboxEl = kids(el, 'EX_GeographicBoundingBox')[0];
    let bbox = null;
    if (bboxEl) {
      const g = function (t) { return parseFloat(firstText(bboxEl, t)); };
      bbox = {
        w: g('westBoundLongitude'), e: g('eastBoundLongitude'),
        s: g('southBoundLatitude'), n: g('northBoundLatitude')
      };
      if ([bbox.w, bbox.e, bbox.s, bbox.n].some(isNaN)) bbox = null;
    }
    return {
      name: firstText(el, 'Name'),
      title: firstText(el, 'Title') || firstText(el, 'Name') || '(ohne Titel)',
      bbox: bbox,
      children: kids(el, 'Layer').map(parseLayer)
    };
  }

  async function loadCapabilities() {
    const url = WMS_URL + '?service=WMS&version=1.3.0&request=GetCapabilities';
    const res = await fetch(url);
    if (!res.ok) throw new Error('GetCapabilities HTTP ' + res.status);
    const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
    if (xml.getElementsByTagName('parsererror').length) {
      throw new Error('Capabilities ist kein gueltiges XML');
    }
    const cap = xml.getElementsByTagNameNS('*', 'Capability')[0];
    if (!cap) throw new Error('kein Capability-Element gefunden');
    const rootLayer = kids(cap, 'Layer')[0];
    if (!rootLayer) throw new Error('kein Wurzel-Layer gefunden');
    return parseLayer(rootLayer);
  }

  // --------------------------------------------------------- imagery helper
  function wmsProvider(layerName) {
    return new Cesium.WebMapServiceImageryProvider({
      url: WMS_URL,
      layers: layerName,
      parameters: {
        service: 'WMS',
        version: '1.3.0',
        format: 'image/png',
        transparent: true,
        styles: ''
      },
      enablePickFeatures: true,
      getFeatureInfoFormats: [
        new Cesium.GetFeatureInfoFormat('json', 'application/json'),
        new Cesium.GetFeatureInfoFormat('text', 'text/plain')
      ]
    });
  }

  // --------------------------------------------------------------- basemap
  // Created FIRST, so it sits at the bottom of the imagery stack by
  // construction. Do not reorder later — reordering is what broke this.
  let osmLayer = null;
  try {
    osmLayer = viewer.imageryLayers.addImageryProvider(
      new Cesium.OpenStreetMapImageryProvider({ url: 'https://tile.openstreetmap.org/' })
    );
  } catch (e) {
    console.warn('OSM-Basiskarte nicht verfuegbar:', e);
    osmLayer = null;
  }

  // ------------------------------------------------------------ the layer tree
  const treeEl = document.getElementById('tree');
  const countEl = document.getElementById('count');
  const registry = new Map();   // wms layer name -> Cesium ImageryLayer

  function collectLeaves(node, out) {
    if (node.children.length === 0) {
      if (node.name) out.push(node);
    } else {
      node.children.forEach(function (c) { collectLeaves(c, out); });
    }
    return out;
  }

  // -------------------------------------------------------- drag and drop
  // The tree order IS the draw order: top of the list renders on top. Dragging
  // reorders the DOM, then applyOrder() replays that onto Cesium's stack.
  let dragEl = null;

  function clearMarks() {
    const marked = document.querySelectorAll('.dropbefore, .dropafter');
    Array.prototype.forEach.call(marked, function (el) {
      el.classList.remove('dropbefore', 'dropafter');
    });
  }

  function applyOrder() {
    const els = document.querySelectorAll('#tree .node[data-layer]');
    const names = Array.prototype.map.call(els, function (el) { return el.dataset.layer; });
    // raise from the bottom up, so the first entry ends up on top.
    // the basemap is never raised and therefore stays underneath everything.
    names.slice().reverse().forEach(function (n) {
      const l = registry.get(n);
      if (l) viewer.imageryLayers.raiseToTop(l);
    });
    console.info('Zeichenreihenfolge (oben -> unten): ' + names.join(' > '));
  }

  function makeDraggable(wrap, grip) {
    // draggable is switched on only while the grip is held, otherwise the
    // opacity slider could not be dragged.
    grip.addEventListener('mousedown', function () { wrap.draggable = true; });
    grip.addEventListener('mouseup', function () { wrap.draggable = false; });

    wrap.addEventListener('dragstart', function (e) {
      dragEl = wrap;
      wrap.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', wrap.dataset.layer || 'group'); } catch (_) {}
    });

    wrap.addEventListener('dragend', function () {
      wrap.classList.remove('dragging');
      wrap.draggable = false;
      clearMarks();
      dragEl = null;
      applyOrder();
    });

    function position(e) {
      const r = wrap.getBoundingClientRect();
      return (e.clientY - r.top) < r.height / 2;   // true = insert before
    }
    function droppable() {
      return dragEl && dragEl !== wrap && dragEl.parentNode === wrap.parentNode
             && !dragEl.contains(wrap);
    }

    wrap.addEventListener('dragover', function (e) {
      if (!droppable()) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const before = position(e);
      wrap.classList.toggle('dropbefore', before);
      wrap.classList.toggle('dropafter', !before);
    });

    wrap.addEventListener('dragleave', function () {
      wrap.classList.remove('dropbefore', 'dropafter');
    });

    wrap.addEventListener('drop', function (e) {
      if (!droppable()) return;
      e.preventDefault();
      e.stopPropagation();
      const before = position(e);
      wrap.parentNode.insertBefore(dragEl, before ? wrap : wrap.nextSibling);
      clearMarks();
    });
  }

  function makeGrip() {
    const g = document.createElement('span');
    g.className = 'grip';
    g.textContent = '⠿';
    g.title = 'Ziehen zum Umsortieren';
    return g;
  }

  function leafRow(node) {
    const frag = document.createDocumentFragment();

    const row = document.createElement('div');
    row.className = 'row';
    row.appendChild(makeGrip());

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !DEFAULT_OFF.has(node.name);

    const lbl = document.createElement('label');
    lbl.textContent = node.title;
    lbl.title = node.name;
    lbl.addEventListener('click', function () { cb.click(); });

    const zoomBtn = document.createElement('button');
    zoomBtn.className = 'zoom';
    zoomBtn.textContent = '⌖';
    zoomBtn.title = 'Auf Layer zoomen';
    zoomBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      const b = node.bbox;
      if (!b) return;
      viewer.camera.flyTo({
        destination: Cesium.Rectangle.fromDegrees(b.w, b.s, b.e, b.n),
        duration: 1.2
      });
    });
    if (!node.bbox) zoomBtn.style.display = 'none';

    row.appendChild(cb);
    row.appendChild(lbl);
    row.appendChild(zoomBtn);

    const op = document.createElement('div');
    op.className = 'opacity';
    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = 0;
    slider.max = 100;
    slider.value = 100;
    const val = document.createElement('span');
    val.textContent = '100%';
    op.appendChild(slider);
    op.appendChild(val);

    function sync() {
      const layer = registry.get(node.name);
      if (layer) {
        layer.show = cb.checked;
        layer.alpha = slider.value / 100;
      }
      op.style.display = cb.checked ? 'flex' : 'none';
    }
    cb.addEventListener('change', sync);
    slider.addEventListener('input', function () {
      val.textContent = slider.value + '%';
      sync();
    });
    sync();

    frag.appendChild(row);
    frag.appendChild(op);
    return frag;
  }

  function renderNode(node, depth) {
    const wrap = document.createElement('div');
    wrap.className = 'node' + (node.children.length ? ' group' : '');

    if (node.children.length === 0) {
      wrap.dataset.layer = node.name;
      wrap.appendChild(leafRow(node));
      makeDraggable(wrap, wrap.querySelector('.grip'));
      return wrap;
    }

    if (depth > 0) {
      const row = document.createElement('div');
      row.className = 'row';
      row.appendChild(makeGrip());
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = true;
      const lbl = document.createElement('label');
      lbl.textContent = node.title;
      lbl.addEventListener('click', function () { cb.click(); });
      cb.addEventListener('change', function () {
        const boxes = wrap.querySelectorAll('.children input[type=checkbox]');
        Array.prototype.forEach.call(boxes, function (c) {
          if (c.checked !== cb.checked) {
            c.checked = cb.checked;
            c.dispatchEvent(new Event('change'));
          }
        });
      });
      row.appendChild(cb);
      row.appendChild(lbl);
      wrap.appendChild(row);
      makeDraggable(wrap, row.querySelector('.grip'));
    }

    const box = document.createElement('div');
    box.className = depth > 0 ? 'children' : '';
    node.children.forEach(function (c) { box.appendChild(renderNode(c, depth + 1)); });
    wrap.appendChild(box);
    return wrap;
  }

  try {
    const root = await loadCapabilities();
    const leaves = collectLeaves(root, []);

    // Cesium stacks last-added on top; add reversed so the tree reads top-down
    leaves.slice().reverse().forEach(function (n) {
      const l = viewer.imageryLayers.addImageryProvider(wmsProvider(n.name));
      l.show = !DEFAULT_OFF.has(n.name);
      registry.set(n.name, l);
    });

    treeEl.innerHTML = '';
    treeEl.appendChild(renderNode(root, 0));
    countEl.textContent = leaves.length + ' Layer';
    applyOrder();   // make Cesium's stack match the tree exactly from the start

    const dragHint = document.createElement('div');
    dragHint.className = 'hint';
    dragHint.textContent = 'Am Griff ziehen, um die Zeichenreihenfolge zu aendern. Oben = vorne.';
    treeEl.appendChild(dragHint);
  } catch (err) {
    treeEl.innerHTML = '';
    const e = document.createElement('div');
    e.className = 'err';
    e.textContent = 'Layer konnten nicht geladen werden: ' + err.message;
    treeEl.appendChild(e);
    console.error(err);
  }

  // ------------------------------------------------------------- 3D section
  const threedEl = document.getElementById('threed');

  function makeToggle(parent, labelText, checked, onChange) {
    const d = document.createElement('div');
    d.className = 'toggle';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = checked;
    const l = document.createElement('label');
    l.textContent = labelText;
    l.addEventListener('click', function () { if (!cb.disabled) cb.click(); });
    cb.addEventListener('change', function () { onChange(cb.checked); });
    d.appendChild(cb);
    d.appendChild(l);
    parent.appendChild(d);
    return cb;
  }

  let meshTerrain = null;
  let tileset = null;
  // OFF by default. The automatic switch rebuilds the globe surface, which is
  // only worth doing once real terrain tiles exist. Turn it on in the panel.
  let autoLod = false;
  let currentMode = null;

  // Probe before switching. A CesiumTerrainProvider pointed at a URL with no
  // tiles leaves the globe with no surface geometry, which renders as a black
  // sphere — so we only ever switch when layer.json really is there.
  let terrainAvailable = null;
  let tilesAvailable = null;

  async function exists(url) {
    try {
      const r = await fetch(url, { cache: 'no-store' });
      return r.ok;
    } catch (e) {
      return false;
    }
  }

  async function checkTerrain() {
    if (terrainAvailable === null) terrainAvailable = await exists(TERRAIN + '/layer.json');
    return terrainAvailable;
  }
  async function checkTiles() {
    if (tilesAvailable === null) tilesAvailable = await exists(TILES3D);
    return tilesAvailable;
  }

  async function getMeshTerrain() {
    if (meshTerrain) return meshTerrain;
    if (!(await checkTerrain())) {
      meshTerrain = flatTerrain;
      return meshTerrain;
    }
    try {
      meshTerrain = await Cesium.CesiumTerrainProvider.fromUrl(TERRAIN, {
        requestVertexNormals: true
      });
    } catch (e) {
      console.warn('Terrain unter ' + TERRAIN + ' nicht ladbar:', e);
      terrainAvailable = false;
      meshTerrain = flatTerrain;
    }
    return meshTerrain;
  }

  async function getTileset() {
    if (tileset !== null) return tileset;
    if (!(await checkTiles())) {
      tileset = false;
      return tileset;
    }
    try {
      tileset = await Cesium.Cesium3DTileset.fromUrl(TILES3D, { maximumScreenSpaceError: 16 });
      scene.primitives.add(tileset);
      tileset.show = false;
    } catch (e) {
      console.warn('3D Tiles nicht ladbar:', e);
      tileset = false;
    }
    return tileset;
  }

  const cbTerrain = makeToggle(threedEl, 'Gelaende (quantized-mesh)', false, async function (v) {
    setTerrain(v ? await getMeshTerrain() : flatTerrain);
  });
  const cbTiles = makeToggle(threedEl, '3D-Gebaeude', false, async function (v) {
    const ts = await getTileset();
    if (ts) ts.show = v;
  });
  makeToggle(threedEl, 'Automatisch nach Zoomstufe', false, function (v) {
    autoLod = v;
    currentMode = null;
    cbTerrain.disabled = v;
    cbTiles.disabled = v;
    if (v) update();
  });

  makeToggle(threedEl, 'Beleuchtung / Schatten', false, function (v) {
    scene.globe.enableLighting = v;
  });

  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = 'pruefe Verfuegbarkeit…';
  threedEl.appendChild(hint);

  // Report what is actually available, and grey out what cannot work.
  (async function () {
    const t = await checkTerrain();
    const b = await checkTiles();
    const msgs = [];
    msgs.push(t ? 'Gelaendekacheln gefunden.'
                : 'Keine Gelaendekacheln unter /terrain - ctb-Profil noch nicht gelaufen.');
    msgs.push(b ? '3D-Gebaeude gefunden.'
                : 'Keine 3D-Tiles unter /3dtiles.');
    hint.textContent = msgs.join(' ');
    if (!t) { cbTerrain.disabled = true; cbTerrain.checked = false; }
    if (!b) { cbTiles.disabled = true; cbTiles.checked = false; }
  })();

  // ----------------------------------------------------------- background
  const baseEl = document.getElementById('base');

  const cbOsm = makeToggle(baseEl, 'OpenStreetMap (extern)', !!osmLayer, function (v) {
    if (osmLayer) osmLayer.show = v;
  });
  if (!osmLayer) cbOsm.disabled = true;

  const baseHint = document.createElement('div');
  baseHint.className = 'hint';
  baseHint.textContent = osmLayer
    ? 'Laedt Kacheln von tile.openstreetmap.org - benoetigt Internet.'
    : 'OSM-Provider nicht verfuegbar (siehe Fehlerbox).';
  baseEl.appendChild(baseHint);

  // Diagnostics: how many imagery layers ended up in the stack, in what order.
  console.info('Imagery-Stack (unten -> oben):',
    Array.from({ length: viewer.imageryLayers.length }, function (_, i) {
      const l = viewer.imageryLayers.get(i);
      return (l === osmLayer ? 'OSM' : (l.imageryProvider && l.imageryProvider.layers) || '?')
             + (l.show ? '' : ' [aus]');
    }).join('  |  '));

  // -------------------------------------------------------- panel collapse
  const panel = document.getElementById('panel');
  document.getElementById('panelHead').addEventListener('click', function () {
    panel.classList.toggle('collapsed');
  });

  // ------------------------------------------------------------- hud + lod
  const altEl = document.getElementById('alt');
  const posEl = document.getElementById('pos');
  const modeEl = document.getElementById('mode');

  async function applyMode(height) {
    if (!autoLod) { modeEl.textContent = 'manuell'; return; }

    let mode;
    if (height > H_TERRAIN) mode = 'globe';
    else if (height > H_3DTILES) mode = 'terrain';
    else mode = 'city';

    if (mode === currentMode) return;
    currentMode = mode;

    // Nothing to switch to: leave the globe exactly as it is. Reassigning the
    // provider would rebuild the surface and blank the map for no benefit.
    if (!(await checkTerrain())) {
      modeEl.textContent = 'Globus (kein DEM)';
      return;
    }

    if (mode === 'globe') {
      setTerrain(flatTerrain);
      if (tileset) tileset.show = false;
      cbTerrain.checked = false;
      cbTiles.checked = false;
    } else {
      const t = await getMeshTerrain();
      setTerrain(t);
      cbTerrain.checked = (t !== flatTerrain);
      const ts = await getTileset();
      if (ts) ts.show = (mode === 'city');
      cbTiles.checked = (mode === 'city') && !!ts;
    }

    const label = {
      globe: 'Globus (flach)',
      terrain: '3D Gelaende',
      city: 'Gelaende + Gebaeude'
    }[mode];
    // be honest when the tiles are simply not there
    modeEl.textContent = (mode !== 'globe' && terrainAvailable === false)
      ? label + ' (kein DEM)'
      : label;
  }

  let ticking = false;
  function update() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(async function () {
      const c = scene.camera.positionCartographic;
      const h = c.height;
      altEl.textContent = h > 10000 ? (h / 1000).toFixed(1) + ' km' : Math.round(h) + ' m';
      posEl.textContent = Cesium.Math.toDegrees(c.latitude).toFixed(4) + ' / ' +
                          Cesium.Math.toDegrees(c.longitude).toFixed(4);
      try { await applyMode(h); } catch (e) { console.error(e); }
      ticking = false;
    });
  }
  scene.camera.percentageChanged = 0.1;
  scene.camera.changed.addEventListener(update);

  viewer.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(10.45, 51.16, 3000000)
  });
  update();

  window.viewer = viewer;
  window.wmsLayers = registry;
})();
</script>
</body>
</html>
