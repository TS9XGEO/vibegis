  cache_upload_dissolve_admin_units:
    grids:
    - webmercator
    - geodetic
    sources:
    - src_upload_dissolve_admin_units
    format: image/png
    cache_dir: /mapproxy/cache_data/upload_dissolve_admin_units
    cache:
      type: file
sources:
  src_upload_admin_units:
    type: wms
    req:
      url: http://mapserver/
      layers: upload_admin_units
      transparent: true
    supported_srs:
    - EPSG:4326
    - EPSG:3857
    wms_opts:
      version: 1.3.0
