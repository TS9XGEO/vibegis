# Generated by upload-api (generate_mapproxy_config() in app.py) — one
# layer/cache/source triple per layer in uploads.map, so every published
# layer is cacheable, not just a hand-picked few. Do not hand-edit while
# the stack is up; it will be overwritten on the next layer change.

services:
  demo: null
  wms:
    srs:
    - EPSG:4326
    - EPSG:3857
    - CRS:84
    image_formats:
    - image/png
    md:
      title: WebGIS Cache
      abstract: Cached MapServer layers
grids:
  webmercator:
    base: GLOBAL_WEBMERCATOR
  geodetic:
    base: GLOBAL_GEODETIC
    srs: CRS:84
    bbox:
    - -180
    - -90
    - 180
    - 90
globals:
  cache:
    base_dir: /mapproxy/cache_data
    lock_dir: /mapproxy/cache_data/locks
    tile_lock_dir: /mapproxy/cache_data/tile_locks
  image:
    resampling_method: bilinear
    paletted: false
  http:
    client_timeout: 120
layers:
- name: upload_admin_units
  title: upload_admin_units
  sources:
  - cache_upload_admin_units
- name: upload_ffentliche_verkehrsmittel
  title: upload_ffentliche_verkehrsmittel
  sources:
  - cache_upload_ffentliche_verkehrsmittel
- name: upload_bahntrassen
  title: upload_bahntrassen
  sources:
  - cache_upload_bahntrassen
- name: dbtable_dwh_upload_buffer_upload_ffentliche_verk
  title: dbtable_dwh_upload_buffer_upload_ffentliche_verk
  sources:
  - cache_dbtable_dwh_upload_buffer_upload_ffentliche_verk
- name: upload_testqgis
  title: upload_testqgis
  sources:
  - cache_upload_testqgis
- name: upload_voronoi_polygons_ffentliche_verkehrsmitt
  title: upload_voronoi_polygons_ffentliche_verkehrsmitt
  sources:
  - cache_upload_voronoi_polygons_ffentliche_verkehrsmitt
- name: upload_testy_mc_test
  title: upload_testy_mc_test
  sources:
  - cache_upload_testy_mc_test
- name: upload_convex_hull
  title: upload_convex_hull
  sources:
  - cache_upload_convex_hull
- name: upload_dissolve_admin_units
  title: upload_dissolve_admin_units
  sources:
  - cache_upload_dissolve_admin_units
caches:
  cache_upload_admin_units:
    grids:
    - webmercator
    - geodetic
    sources:
    - src_upload_admin_units
    format: image/png
    cache_dir: /mapproxy/cache_data/upload_admin_units
    cache:
      type: file
  cache_upload_ffentliche_verkehrsmittel:
    grids:
    - webmercator
    - geodetic
    sources:
    - src_upload_ffentliche_verkehrsmittel
    format: image/png
    cache_dir: /mapproxy/cache_data/upload_ffentliche_verkehrsmittel
    cache:
      type: file
  cache_upload_bahntrassen:
    grids:
    - webmercator
    - geodetic
    sources:
    - src_upload_bahntrassen
    format: image/png
    cache_dir: /mapproxy/cache_data/upload_bahntrassen
    cache:
      type: file
  cache_dbtable_dwh_upload_buffer_upload_ffentliche_verk:
    grids:
    - webmercator
    - geodetic
    sources:
    - src_dbtable_dwh_upload_buffer_upload_ffentliche_verk
    format: image/png
    cache_dir: /mapproxy/cache_data/dbtable_dwh_upload_buffer_upload_ffentliche_verk
    cache:
      type: file
  cache_upload_testqgis:
    grids:
    - webmercator
    - geodetic
    sources:
    - src_upload_testqgis
    format: image/png
    cache_dir: /mapproxy/cache_data/upload_testqgis
    cache:
      type: file
  cache_upload_voronoi_polygons_ffentliche_verkehrsmitt:
    grids:
    - webmercator
    - geodetic
    sources:
    - src_upload_voronoi_polygons_ffentliche_verkehrsmitt
    format: image/png
    cache_dir: /mapproxy/cache_data/upload_voronoi_polygons_ffentliche_verkehrsmitt
    cache:
      type: file
  cache_upload_testy_mc_test:
    grids:
    - webmercator
    - geodetic
    sources:
    - src_upload_testy_mc_test
    format: image/png
    cache_dir: /mapproxy/cache_data/upload_testy_mc_test
    cache:
      type: file
  cache_upload_convex_hull:
    grids:
    - webmercator
    - geodetic
    sources:
    - src_upload_convex_hull
    format: image/png
    cache_dir: /mapproxy/cache_data/upload_convex_hull
