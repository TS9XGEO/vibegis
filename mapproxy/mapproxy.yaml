# Generated by upload-api (generate_mapproxy_config() in app.py) — one
# layer/cache/source triple per layer in uploads.map, so every published
# layer is cacheable, not just a hand-picked few. Do not hand-edit while
# the stack is up; it will be overwritten on the next layer change.

services:
  demo: null
  wms:
    srs:
    - EPSG:4326
    - EPSG:3857
    - CRS:84
    image_formats:
    - image/png
    md:
      title: WebGIS Cache
      abstract: Cached MapServer layers
grids:
  webmercator:
    base: GLOBAL_WEBMERCATOR
  geodetic:
    base: GLOBAL_GEODETIC
    srs: CRS:84
    bbox:
    - -180
    - -90
    - 180
    - 90
globals:
  cache:
    base_dir: /mapproxy/cache_data
    lock_dir: /mapproxy/cache_data/locks
    tile_lock_dir: /mapproxy/cache_data/tile_locks
  image:
    resampling_method: bilinear
    paletted: false
  http:
    client_timeout: 120
layers:
- name: dbtable_gis_roads
  title: dbtable_gis_roads
  sources:
  - cache_dbtable_gis_roads
- name: dbtable_raw_upload_oberbayern
  title: dbtable_raw_upload_oberbayern
  sources:
  - cache_dbtable_raw_upload_oberbayern
- name: dbtable_raw_osm_landuse
  title: dbtable_raw_osm_landuse
  sources:
  - cache_dbtable_raw_osm_landuse
- name: upload_test
  title: upload_test
  sources:
  - cache_upload_test
- name: upload_lau_rg_01m_2024_3035
  title: upload_lau_rg_01m_2024_3035
  sources:
  - cache_upload_lau_rg_01m_2024_3035
caches:
  cache_dbtable_gis_roads:
    grids:
    - webmercator
    - geodetic
    sources:
    - src_dbtable_gis_roads
    format: image/png
    cache_dir: /mapproxy/cache_data/dbtable_gis_roads
    cache:
      type: file
  cache_dbtable_raw_upload_oberbayern:
    grids:
    - webmercator
    - geodetic
    sources:
    - src_dbtable_raw_upload_oberbayern
    format: image/png
    cache_dir: /mapproxy/cache_data/dbtable_raw_upload_oberbayern
    cache:
      type: file
  cache_dbtable_raw_osm_landuse:
    grids:
    - webmercator
    - geodetic
    sources:
    - src_dbtable_raw_osm_landuse
    format: image/png
    cache_dir: /mapproxy/cache_data/dbtable_raw_osm_landuse
    cache:
      type: file
  cache_upload_test:
    grids:
    - webmercator
    - geodetic
    sources:
    - src_upload_test
    format: image/png
    cache_dir: /mapproxy/cache_data/upload_test
    cache:
      type: file
  cache_upload_lau_rg_01m_2024_3035:
    grids:
    - webmercator
    - geodetic
    sources:
    - src_upload_lau_rg_01m_2024_3035
    format: image/png
    cache_dir: /mapproxy/cache_data/upload_lau_rg_01m_2024_3035
    cache:
      type: file
sources:
  src_dbtable_gis_roads:
    type: wms
    req:
      url: http://mapserver/
      layers: dbtable_gis_roads
      transparent: true
    supported_srs:
    - EPSG:4326
    - EPSG:3857
    wms_opts:
      version: 1.3.0
  src_dbtable_raw_upload_oberbayern:
    type: wms
    req:
      url: http://mapserver/
      layers: dbtable_raw_upload_oberbayern
      transparent: true
    supported_srs:
    - EPSG:4326
    - EPSG:3857
    wms_opts:
      version: 1.3.0
  src_dbtable_raw_osm_landuse:
    type: wms
    req:
      url: http://mapserver/
      layers: dbtable_raw_osm_landuse
      transparent: true
    supported_srs:
    - EPSG:4326
    - EPSG:3857
    wms_opts:
      version: 1.3.0
  src_upload_test:
    type: wms
    req:
      url: http://mapserver/
      layers: upload_test
      transparent: true
    supported_srs:
    - EPSG:4326
    - EPSG:3857
    wms_opts:
      version: 1.3.0
  src_upload_lau_rg_01m_2024_3035:
    type: wms
    req:
      url: http://mapserver/
      layers: upload_lau_rg_01m_2024_3035
      transparent: true
    supported_srs:
    - EPSG:4326
    - EPSG:3857
    wms_opts:
      version: 1.3.0
